<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download GoalPe — Daily Fantasy Football</title>
    <meta name="description"
        content="Build your dream team, join contests and climb the leaderboard. Get the GoalPe app on iOS and Android.">
    <!--
      This page is a redirect, so it should not compete with the homepage in search.
      It uses rel=canonical rather than robots=noindex on purpose: the WhatsApp /
      Facebook preview crawler honours noindex and would refuse to build a preview,
      and this is the link we share.
    -->
    <link rel="canonical" href="https://goalpe.live/">

    <!-- Link preview (WhatsApp, iMessage, Facebook, LinkedIn, Slack) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GoalPe">
    <meta property="og:locale" content="en_IN">
    <meta property="og:url" content="https://goalpe.live/download_now.html">
    <meta property="og:title" content="Download GoalPe — Daily Fantasy Football">
    <meta property="og:description"
        content="Build your dream team, join contests and climb the leaderboard. Get the GoalPe app on iOS and Android.">
    <meta property="og:image" content="https://goalpe.live/assets/images/og-image.jpg?v=1">
    <meta property="og:image:secure_url" content="https://goalpe.live/assets/images/og-image.jpg?v=1">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="GoalPe — Play. Compete. Win. Daily fantasy football on iOS and Android.">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Download GoalPe — Daily Fantasy Football">
    <meta name="twitter:description"
        content="Build your dream team, join contests and climb the leaderboard. Get the GoalPe app on iOS and Android.">
    <meta name="twitter:image" content="https://goalpe.live/assets/images/og-image.jpg?v=1">

    <meta name="theme-color" content="#0A0A0A">
    <link rel="icon" type="image/png" href="/assets/images/goalpe-favicon.png">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background-color: #0a0a0a;
        }
    </style>
    <script src="/js/store_links.js"></script>
    <script>
        (function () {
            // Leave preview crawlers on the page so they read the og: tags above
            // instead of being bounced to the store and reporting Apple's card.
            if (window.GOALPE.isCrawler()) {
                return;
            }
            // replace() keeps this page out of history, so Back returns to
            // wherever the user came from instead of re-triggering the redirect.
            window.location.replace(window.GOALPE.getStoreUrl());
        })();
    </script>
</head>

<body>
